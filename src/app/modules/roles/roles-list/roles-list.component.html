<div>
  <app-slide-menu></app-slide-menu>
  <app-navbar></app-navbar>
</div>

<div class="tittle">
  <h1><i class="fas fa-user-shield"></i> Roles</h1>
</div>

<!-- Table with Roles -->
<div>
  <!-- fetch by nameRole or namePermission -->
  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Write role" #input>
  </mat-form-field>

  <!-- Table  -->
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

      <!-- Name Column -->
      <ng-container matColumnDef="Name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let row"> {{row.Name}} </td>
      </ng-container>

      <!-- Description Column -->
       <ng-container matColumnDef="Description">
          <th mat-header-cell *matHeaderCellDef> Description </th>
          <td mat-cell *matCellDef="let row"> {{row.Description}} </td>
       </ng-container>

       <!-- Action Column -->
      <ng-container matColumnDef="Actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary">
            <mat-icon>edit_note</mat-icon>
          </button>
          <button mat-icon-button color="warn">
            <mat-icon>delete_forever</mat-icon>
          </button>
        </td>
      </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row show when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No Data matching the filter "{{input.value}}"</td>
        </tr>
    </table>

    <!-- Paginator -->
     <mat-paginator [pageSizeOptions]="[10, 20, 30, 40, 50]" aria-label="Select page of Roles"></mat-paginator>
  </div>
</div>
